<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="512" height="512" rx="112" fill="#07060b"/>
  <rect width="512" height="512" rx="112" fill="url(#g)" opacity="0.15"/>
  <!-- Equalizer bars -->
  <rect x="100" y="220" width="40" height="160" rx="20" fill="url(#g)" opacity="0.9"/>
  <rect x="160" y="160" width="40" height="220" rx="20" fill="url(#g)" opacity="0.95"/>
  <rect x="220" y="120" width="40" height="260" rx="20" fill="url(#g)"/>
  <rect x="280" y="180" width="40" height="200" rx="20" fill="url(#g2)"/>
  <rect x="340" y="140" width="40" height="240" rx="20" fill="url(#g2)" opacity="0.95"/>
  <rect x="400" y="200" width="40" height="180" rx="20" fill="url(#g2)" opacity="0.9"/>
  <!-- Glow effect -->
  <rect x="220" y="120" width="40" height="260" rx="20" fill="#8b5cf6" opacity="0.3" filter="blur(8px)"/>
  <rect x="340" y="140" width="40" height="240" rx="20" fill="#06b6d4" opacity="0.3" filter="blur(8px)"/>
</svg>
